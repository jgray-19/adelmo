<svg class="tour-svg tour-flow" viewBox="-10 0 580 310" role="img" aria-label="Flowchart: the main process sends Start, runs the batch step for every batch, then sends Stop">
  <defs><marker id="mo-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text x="150" y="24" text-anchor="middle" class="lane lane-main">MAIN PROCESS</text>
  <text x="450" y="24" text-anchor="middle" class="lane lane-worker">EACH WORKER</text>
  <line x1="300" y1="38" x2="300" y2="128" class="divider"/>
  <line x1="300" y1="208" x2="300" y2="302" class="divider"/>

  <rect x="50" y="58" width="200" height="44" rx="6" class="box-main"/>
  <text x="150" y="84" text-anchor="middle">Send starting knobs</text>
  <rect x="350" y="58" width="200" height="44" rx="6" class="box-worker"/>
  <text x="450" y="84" text-anchor="middle">Load MAD-NG</text>
  <path d="M250,80 L346,80" class="arrow" marker-end="url(#mo-a)"/>
  <text x="298" y="72" text-anchor="middle" class="msg">Start</text>

  <path d="M150,102 L150,136" class="arrow" marker-end="url(#mo-a)"/>

  <rect x="50" y="140" width="500" height="56" rx="4" class="box-sub"/>
  <line x1="64" y1="140" x2="64" y2="196" class="sub-edge"/>
  <line x1="536" y1="140" x2="536" y2="196" class="sub-edge"/>
  <text x="300" y="165" text-anchor="middle" class="strong">Batch step</text>
  <text x="300" y="184" text-anchor="middle" class="muted small">shown in the next diagram</text>

  <path d="M50,182 L22,182 L22,154 L46,154" class="arrow loop" marker-end="url(#mo-a)"/>
  <text x="8" y="168" text-anchor="middle" class="muted small" transform="rotate(-90 8 168)">next batch</text>

  <path d="M150,196 L150,244" class="arrow" marker-end="url(#mo-a)"/>
  <text x="160" y="225" class="muted small">when finished</text>

  <rect x="50" y="248" width="200" height="44" rx="6" class="box-main"/>
  <text x="150" y="274" text-anchor="middle">Send stop</text>
  <rect x="350" y="248" width="200" height="44" rx="6" class="box-worker"/>
  <text x="450" y="274" text-anchor="middle">Shut down</text>
  <path d="M250,270 L346,270" class="arrow" marker-end="url(#mo-a)"/>
  <text x="298" y="262" text-anchor="middle" class="msg">Stop</text>
</svg>
