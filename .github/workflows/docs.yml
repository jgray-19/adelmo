name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  UV_COMPILE_BYTECODE: 1
  PYTHON_VERSION: "3.13"

defaults:
  run:
    shell: bash
    working-directory: sgd-magnet-tuner

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          path: sgd-magnet-tuner

      - uses: actions/checkout@v5
        with:
          repository: jgray-19/pymadng-utils
          path: pymadng-utils

      - uses: actions/checkout@v5
        with:
          repository: jgray-19/tmom-recon
          path: tmom-recon

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: sgd-magnet-tuner/pyproject.toml

      - name: Install package and docs dependencies
        run: uv pip install -e '.[docs]'

      - name: Build Sphinx HTML
        run: sphinx-build -b html docs docs/_build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: sgd-magnet-tuner/docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
