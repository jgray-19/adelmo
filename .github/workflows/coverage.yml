name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  fast:
    name: Fast contracts
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: "not slow and not regression and not convergence and not e2e"
      coverage-flag: fast
      parallel: true
    secrets: inherit

  regression:
    name: Controller regressions
    needs: fast
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: regression
      coverage-flag: regression
    secrets: inherit

  integration:
    name: Slow integration
    needs: fast
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: "slow and not regression and not convergence and not e2e"
      coverage-flag: integration
    secrets: inherit

  convergence:
    name: Convergence
    needs: regression
    uses: ./.github/workflows/_convergence.yml
    secrets: inherit

  e2e:
    name: E2E
    needs: [integration, convergence]
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule') &&
      vars.E2E_RUNNER != ''
    uses: ./.github/workflows/_pytest.yml
    with:
      markers: e2e
      runner: ${{ vars.E2E_RUNNER }}
    secrets: inherit